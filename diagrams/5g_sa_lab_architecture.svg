<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Open5GS UERANSIM 5G SA Lab Architecture</title>
  <desc id="desc">UERANSIM UE and gNB connect to Open5GS AMF, SMF, UPF, NRF, MongoDB, and data network using N1, N2, N3, N4, N6 and SBI interfaces.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f3b52"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #2f3b52; stroke-width: 2; rx: 8; }
      .core { fill: #eef6ff; }
      .ran { fill: #f2fbf5; }
      .db { fill: #fff7ed; }
      .text { font-family: Arial, sans-serif; font-size: 18px; fill: #172033; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #45536b; }
      .line { stroke: #2f3b52; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="40" y="42" class="text" style="font-size:24px;font-weight:700">Open5GS + UERANSIM 5G Standalone Lab</text>

  <rect class="box ran" x="55" y="120" width="160" height="90"/>
  <text class="text" x="88" y="158">UE</text>
  <text class="small" x="76" y="184">UERANSIM</text>

  <rect class="box ran" x="285" y="120" width="170" height="90"/>
  <text class="text" x="322" y="158">gNB</text>
  <text class="small" x="310" y="184">UERANSIM</text>

  <rect class="box core" x="540" y="88" width="170" height="80"/>
  <text class="text" x="588" y="133">AMF</text>

  <rect class="box core" x="540" y="225" width="170" height="80"/>
  <text class="text" x="590" y="270">SMF</text>

  <rect class="box core" x="790" y="225" width="170" height="80"/>
  <text class="text" x="840" y="270">UPF</text>

  <rect class="box core" x="790" y="88" width="170" height="80"/>
  <text class="text" x="840" y="133">NRF</text>

  <rect class="box db" x="540" y="370" width="170" height="80"/>
  <text class="text" x="578" y="405">MongoDB</text>
  <text class="small" x="566" y="429">subscriber DB</text>

  <rect class="box" x="1020" y="225" width="135" height="80"/>
  <text class="text" x="1052" y="258">Data</text>
  <text class="small" x="1045" y="283">Network</text>

  <path class="line" d="M215 165 L285 165"/>
  <text class="small" x="228" y="151">N1 NAS</text>

  <path class="line" d="M455 146 L540 128"/>
  <text class="small" x="468" y="116">N2 NGAP/SCTP</text>

  <path class="line" d="M455 190 C560 205 655 235 790 255"/>
  <text class="small" x="565" y="218">N3 GTP-U</text>

  <path class="line" d="M710 128 L790 128"/>
  <text class="small" x="731" y="113">SBI</text>

  <path class="line" d="M710 265 L790 265"/>
  <text class="small" x="731" y="250">N4 PFCP</text>

  <path class="line" d="M625 168 L625 225"/>
  <text class="small" x="637" y="202">N11</text>

  <path class="line" d="M960 265 L1020 265"/>
  <text class="small" x="975" y="250">N6</text>

  <path class="line dash" d="M625 305 L625 370"/>
  <text class="small" x="637" y="345">state</text>
</svg>

