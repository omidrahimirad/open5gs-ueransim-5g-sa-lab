<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">5G SA System Integration and Failure Injection Validation Lab</title>
  <desc id="desc">UERANSIM UE and gNB connect to Open5GS NRF, AMF, AUSF, UDM, UDR, PCF, SMF, UPF, MongoDB, internal data network server, and a validation harness.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#253247"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #253247; stroke-width: 2; rx: 8; }
      .ran { fill: #effaf2; }
      .core { fill: #edf6ff; }
      .db { fill: #fff7e6; }
      .dn { fill: #f4f0ff; }
      .tool { fill: #f3f4f6; }
      .text { font-family: Arial, sans-serif; font-size: 17px; fill: #142033; }
      .small { font-family: Arial, sans-serif; font-size: 13px; fill: #46566d; }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #142033; }
      .line { stroke: #253247; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>
  <rect width="1300" height="720" fill="#ffffff"/>
  <text x="40" y="44" class="title">5G SA System Integration and Failure-Injection Validation Lab</text>

